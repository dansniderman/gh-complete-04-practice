name: Lint, Test, and Deploy

on: push

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint -- --no-fix

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Deploy (placeholder)
        run: echo "Deployment placeholder - no app is published."